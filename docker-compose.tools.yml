name: test_actions

services:
  base:
    image: scratch
    working_dir: /workdir
    volumes:
      - .:/workdir

  actionlint:
    extends: base
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  zizmor:
    extends: base
    image: ghcr.io/zizmorcore/zizmor:1.27.0@sha256:5800c8d5e83263d68a8874989b0eb3939e177540e9395de48158d24656141ee9
    environment:
      - GH_TOKEN
